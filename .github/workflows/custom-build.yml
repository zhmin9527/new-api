name: Build Custom Binary

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          VITE_REACT_APP_VERSION=$(cat ../VERSION) bun run build
          ls -la dist | head

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false

      - name: Build backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          GOWORK: "off"
        run: |
          VER=$(cat VERSION)
          echo "version=$VER"
          go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VER'" -o new-api .
          gzip -9 -k -f new-api
          ls -la new-api new-api.gz
          sha256sum new-api.gz

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom
          name: custom-build
          body: |
            Automated custom build (push-triggered).
            Download new-api.gz, gunzip it on the server and bind-mount over /new-api.
          files: new-api.gz
          make_latest: false
